[package]
name = "baals"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "baals"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
ed25519-dalek = { version = "2.2", features = ["serde"] }
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
wasmtime = "18.0"
anyhow = "1.0"
rand = "0.8"
thiserror = "1.0"
async-trait = "0.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
zeroize = "1.7"
dirs = "5.0"
log = "0.4"
postcard = "1.0"
sysinfo = "0.29"
criterion = "0.5"
toml = "0.8"
env_logger = "0.10"
tiny_http = "0.12"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"

[dev-dependencies]
tempfile = "3.8"
env_logger = "0.10"
bincode = "1.3"

[[bench]]
name = "performance_benchmarks"
harness = false 
