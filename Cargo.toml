[package]
name = "baals"
exclude = ["fuzz"]
version = "0.1.0"
edition = "2021"
description = "BaaLS - Blockchain as a Local Service: an embedded blockchain node with WASM smart contracts, PoA consensus, and dual-storage backend"
license = "MIT"
repository = "https://github.com/anomalyco/baals"
homepage = "https://baals.dev"
keywords = ["blockchain", "wasm", "embedded", "consensus", "ledger"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "baalsd"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
redb = "2.0"
ed25519-dalek = { version = "2.2", features = ["serde"] }
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
wasmtime = "43.0.1"
wasmparser = "0.245.1"
anyhow = "1.0"
rand = "0.9"
thiserror = "1.0"
async-trait = "0.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
zeroize = "1.7"
dirs = "5.0"
log = "0.4"
sysinfo = "0.39"
toml = "0.8"
env_logger = "0.10"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = { version = "2.12", features = ["json"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
tokio-tungstenite = "0.24"
futures-util = "0.3"
mdns-sd = { version = "0.11", optional = true }
argon2 = "0.5.3"
base64 = "0.22"
hmac = "0.12"
tempfile = "3.8"
lru = "0.12"
libc = "0.2"
k256 = { version = "0.13", features = ["ecdsa"] }
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
criterion = "0.8"
wat = "1.0"

[features]
default = []
mdns = ["mdns-sd"]

[[bench]]
name = "performance_benchmarks"
harness = false 
