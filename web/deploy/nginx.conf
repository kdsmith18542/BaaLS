server {
    listen 80;
    server_name baals.network www.baals.network;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name baals.network www.baals.network;

    # Configure your cert paths
    ssl_certificate /etc/letsencrypt/live/baals.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baals.network/privkey.pem;

    root /var/www/baals/web;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss: http://127.0.0.1:8080 ws://127.0.0.1:8081; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to local BaaLS node
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional auth legacy alias
    location = /auth/token {
        proxy_pass http://127.0.0.1:8080/auth/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy WS stream route to BaaLS WS server (port 8081)
    location /ws {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
