# cargo-deny configuration for BaaLS production dependency policy.
# Run: cargo deny check

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = []
# Known issues requiring runtime updates (monitor aggressively)
notice = "deny"
severity-threshold = "medium"
unmaintained = "deny"
unsound = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
exceptions = []

[bans]
version = 2
multiple-versions = "deny"
deny = []
skip = []
skip-tree = []

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
