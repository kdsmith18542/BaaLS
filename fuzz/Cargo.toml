[package]
name = "baals-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
baals = { path = ".." }

[[bin]]
name = "fuzz_transaction"
