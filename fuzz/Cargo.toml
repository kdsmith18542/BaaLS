test = false
doc = false

[[bin]]
name = "fuzz_wasm_module"
path = "fuzz_targets/fuzz_wasm_module.rs"
test = false
doc = false

[[bin]]
name = "fuzz_block"
path = "fuzz_targets/fuzz_block.rs"
test = false
doc = false
