# Ecosystem pipeline event log rotation
/var/log/ecosystem/pipeline.jsonl {
    weekly
    rotate 13
    maxage 90
    missingok
    notifempty
    compress
    delaycompress
    create 644 root root
    postrotate
        logger -t eco-logrotate "Rotated /var/log/ecosystem/pipeline.jsonl"
    endscript
}
